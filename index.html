<meta name="apple-mobile-web-app-title" content="Ferret EMS">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1016; --surface:#131a23; --surface2:#1a232e; --border:#243040;
    --fg:#dbe4f0; --muted:#7a8799;
    --self:#22c55e; --stop:#64748b; --charge:#3b82f6; --discharge:#ef4444;
    --absorb:#86efac; --cover:#15803d; --sol:#eab308; --last:#cbd5e1;
    --now:#f59e0b;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  /* Bakgrund: nastan svart med svaga ljuskallor i mork orange, i ett fast
     lager bakom innehallet. Fast bakgrund via background-attachment
     fungerar inte i Safari pa iPhone, darfor ett eget lager. */
  html{background:#08080a}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(ellipse 85% 55% at 25% -5%,  rgba(154,52,18,.34), transparent 70%),
      radial-gradient(ellipse 60% 45% at 90% 20%,  rgba(124,45,18,.20), transparent 70%),
      radial-gradient(ellipse 75% 50% at 40% 105%, rgba(110,38,12,.16), transparent 70%),
      #08080a}
  body{margin:0;background:transparent;color:var(--fg);
       font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.5}
  .marke{display:flex;align-items:center;gap:10px}
  .marke .logga{width:52px;height:38px;flex:none}
  .wrap{max-width:720px;margin:0 auto;padding:14px}
  h1{font-size:17px;font-weight:600;margin:0 0 12px}
  h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
     color:var(--muted);margin:22px 0 8px}

  /* Status */
  /* Tva kolumner pa liten skarm: lage och batteri pa forsta raden,
     kopa och salja pa andra. Fyra i bredd forst nar det far plats. */
  .status{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media (min-width:560px){ .status{grid-template-columns:repeat(4,1fr)} }
  .status .kpi{padding:10px}
  .status .kpi .v{font-size:17px}
  .rubrikrad{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:22px 0 8px}
  .rubrikrad h2{margin:0}
  .vy{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
  .vy button{border:0;border-radius:0;padding:5px 10px;font-size:12px;background:var(--surface)}
  .vy button + button{border-left:1px solid var(--border)}
  .vy button.aktiv{background:var(--surface2);color:var(--fg);font-weight:600}
  .status .kpi .sub{font-size:10.5px;margin-top:3px;white-space:nowrap}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 12px}
  .kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .kpi .v{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:500;margin-top:3px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .u{font-size:11px;color:var(--muted);margin-left:2px}
  .kpi .sub{font-size:11.5px;color:var(--muted);margin-top:5px;font-family:'Inter',sans-serif}
  .kpi .sub b{color:var(--fg);font-weight:500;font-family:'JetBrains Mono',monospace}
  .kpi .sub.total{border-top:1px solid var(--border);margin-top:7px;padding-top:6px;color:var(--fg)}
  .econ .kpi{grid-column:1/-1}
  .kpi.stor .v{font-size:26px}
  .next{margin-top:8px;font-size:13px;color:var(--muted)}
  .next b{color:var(--fg);font-weight:500}

  /* Diagram */
  .chart{background:var(--surface);border:1px solid var(--border);border-radius:9px;
         padding:10px 10px 6px;margin-top:6px;position:relative;touch-action:pan-y}
  .chart svg{display:block;width:100%;height:190px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);
          margin-top:6px;padding:0 2px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
  /* Avlasningsrad under diagrammet i stallet for en ruta ovanpa det */
  .readout{font-size:12.5px;font-family:'JetBrains Mono',monospace;color:var(--muted);
           padding:6px 2px 0;min-height:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .readout b{color:var(--fg);font-weight:500}
  .cursor{position:absolute;top:10px;bottom:24px;width:1px;background:var(--now);
          opacity:.75;pointer-events:none;display:none}

  /* Ekonomi */
  .econ{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

  /* Timlista */
  details{background:var(--surface);border:1px solid var(--border);border-radius:9px;
          margin-top:8px;overflow:hidden}
  details>summary{cursor:pointer;padding:11px 13px;font-size:14px;list-style:none;
                  display:flex;justify-content:space-between;align-items:center;gap:10px}
  /* Timraderna: fasta kolumner sa tid, lagen och SoC star i linje */
  .timrad>summary{display:grid;grid-template-columns:auto 1fr auto auto;gap:9px;align-items:center}
  .timrad>summary .tid{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:13px}
  .timrad>summary .soc{font-family:'JetBrains Mono',monospace;font-size:13px;text-align:right}
  details>summary::-webkit-details-marker{display:none}
  details>summary::after{content:'+';color:var(--muted);font-family:'JetBrains Mono',monospace}
  details[open]>summary::after{content:'−'}
  .inner{padding:0 13px 13px}
  .rows{width:100%;border-collapse:collapse;font-size:13px;
        font-family:'JetBrains Mono',monospace}
  .rows td{padding:5px 4px;border-top:1px solid var(--border)}
  .rows tr:first-child td{border-top:none}
  .rows .t{color:var(--muted);width:52px}
  .rows .s{text-align:right;width:46px}
  .badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;color:#06121a;
         font-family:'Inter',sans-serif;font-weight:500}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{background:var(--surface2);border:1px solid var(--border);border-radius:13px;
        padding:4px 10px;font-size:12px;font-family:'JetBrains Mono',monospace}
  .chip b{color:var(--muted);font-weight:400;font-family:'Inter',sans-serif;font-size:11px;margin-right:5px}
  textarea{width:100%;height:110px;background:var(--surface2);border:1px solid var(--border);
           border-radius:6px;color:var(--fg);padding:8px;font-family:'JetBrains Mono',monospace;
           font-size:11px;resize:vertical}
  input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;
        color:var(--fg);padding:9px 10px;font-family:'JetBrains Mono',monospace;font-size:12px}
  label{display:block;font-size:11px;color:var(--muted);margin:10px 0 3px;
        text-transform:uppercase;letter-spacing:.05em}
  button{background:var(--surface2);border:1px solid var(--border);border-radius:6px;
         color:var(--fg);padding:9px 13px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--muted)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px}
  .ok{color:var(--self)} .bad{color:var(--discharge)}
  .mono{font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.7}
  .note{font-size:11px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

<h1 class="marke"><svg class="logga" xmlns="http://www.w3.org/2000/svg" viewBox="2 10 60 44" aria-hidden="true"> <g transform="translate(32 32) scale(0.92) translate(-32.5 -38)"> <path d="M22 44 L 21 53" stroke="#5c210d" stroke-width="3.6" stroke-linecap="round"/> <path d="M41 37 L 40.5 47" stroke="#5c210d" stroke-width="3.4" stroke-linecap="round"/> <path d="M15.5 40 C 8.5 40.5, 4.5 45.5, 3.5 53.5 C 7 49.5, 10.5 47, 16.5 46 Z" fill="#7c2d12"/> <path d="M13 45 C 12 35.5, 20 25, 30 23.5 C 38 22.5, 43.5 25.5, 47 29 L 47 37.5 C 42 33.5, 35 31.5, 29 33.5 C 24 35.5, 22 41, 21.2 45.8 C 20.4 49.6, 14.4 50, 13 45 Z" fill="#c2410c"/> <path d="M17 45 L 13.8 53" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/> <path d="M45 36 L 47.5 46.5" stroke="#7c2d12" stroke-width="3.8" stroke-linecap="round"/> <ellipse cx="51" cy="32" rx="8.4" ry="6.2" transform="rotate(12 51 32)" fill="#c2410c"/> <path d="M56 31.5 L 61 35.5 L 56.5 37.5 Z" fill="#c2410c"/> <circle cx="46.8" cy="26.3" r="3.1" fill="#c2410c"/> <circle cx="46.8" cy="26.3" r="1.4" fill="#7c2d12"/> <path d="M45.5 31 C 49 28.2, 54.5 28.8, 58 33.2 C 54.5 32.2, 50 32.8, 46.5 34.6 Z" fill="#fdba74"/> <circle cx="52.4" cy="31.4" r="1.3" fill="#1a0f0a"/> <circle cx="61" cy="35.6" r="1.2" fill="#1a0f0a"/> </g> </svg><span>Ferret EMS</span></h1>

<div id="app" style="display:none">
  <div class="status" id="kpi"></div>
  <div class="next" id="next"></div>

  <div class="rubrikrad">
    <h2>Energiflöden</h2>
    <div class="vy" id="vy">
      <button data-vy="idag">Idag</button>
      <button data-vy="imorgon">Imorgon</button>
      <button data-vy="bada">2 dagar</button>
    </div>
  </div>
  <div id="floden"></div>

  <h2>Priser</h2>
  <div id="priser"></div>

  <h2>Ekonomi för vald period</h2>
  <div class="econ" id="econ"></div>
  <div class="note" id="econnote"></div>

  <h2>Detaljer</h2>
  <details id="d-timmar"><summary>Timme för timme<span></span></summary><div class="inner" id="timmar"></div></details>
  <details><summary>Modeller och prognoser</summary><div class="inner" id="modeller"></div></details>
  <details><summary>Exekveringslogg</summary><div class="inner" id="exlogg"></div></details>
  <details><summary>Rådata</summary><div class="inner">
    <label>DP_Plan</label><textarea id="raw-plan"></textarea>
    <label>DP_Debug</label><textarea id="raw-debug"></textarea>
    <label>DP_Exec_Log</label><textarea id="raw-exec"></textarea>
    <div class="row"><button onclick="renderaFranFalt()">Rita om från fälten</button></div>
  </div></details>
</div>

<h2>Anslutning</h2>
<details id="d-conn">
  <summary><span id="conn-sum">Homey</span></summary>
  <div class="inner">
    <label>Adress</label>
    <input id="c-url" placeholder="https://xxxx.connect.athom.com">
    <label>Token</label>
    <input id="c-token" type="password" placeholder="API-nyckel med läsrätt på Logic">
    <label>Loggens adress (valfri)</label>
    <input id="c-logurl" placeholder="https://script.google.com/macros/s/.../exec">
    <label>Loggens nyckel</label>
    <input id="c-logkey" type="password" placeholder="samma nyckel som i Log_Quarter">
    <div class="row">
      <button onclick="hamtaNu()">Hämta nu</button>
      <button onclick="glomUppgifter()">Glöm</button>
      <button onclick="skapaBokmarke()">Bokmärkeslänk</button>
    </div>
    <div class="mono" id="conn-log" style="margin-top:10px"></div>
    <div class="note">Adress, token och loggnyckel sparas bara i den här webbläsaren. Utan logg visas bara planen i diagrammen över effekt och energiflöden.</div>
  </div>
</details>

</div>

<script>
const F = { Self:'var(--self)', Absorb:'var(--absorb)', Cover:'var(--cover)',
            Stop:'var(--stop)', Charge:'var(--charge)', Discharge:'var(--discharge)' };
const qH = q => String(Math.floor((((q%96)+96)%96)/4)).padStart(2,'0');
const qT = q => `${String(Math.floor((((q%96)+96)%96)/4)).padStart(2,'0')}:${String(((q%4)+4)%4*15).padStart(2,'0')}`;
const kr = v => (v<0?'−':'') + Math.abs(v).toFixed(2).replace('.',',');
let PLAN = null, DBG = null, UTFALL = [];

function kort(k, v, u, sub){
  return `<div class="kpi"><div class="k">${k}</div><div class="v">${v}<span class="u">${u||''}</span></div>`
       + (sub ? `<div class="sub">${sub}</div>` : '') + `</div>`;
}
function badge(m, pw){
  return `<span class="badge" style="background:${F[m]||'var(--muted)'}">${m}${pw?' '+pw:''}</span>`;
}

// ---------- Status ----------
function ritaStatus(){
  const p = PLAN[0];
  const impNu = DBG && DBG.imp ? DBG.imp[0] : null;
  const expNu = DBG && DBG.exp ? DBG.exp[0] : null;
  // Lagsta och hogsta i horisonten, sa nuvarande pris far ett sammanhang
  const spann = a => (a && a.length)
    ? `${kr(Math.min(...a))} – ${kr(Math.max(...a))}` : '';

  document.getElementById('kpi').innerHTML =
      kort('Läge nu', p.mode + (p.power ? ' ' + p.power : ''), p.power ? 'kW' : '')
    + kort('Batteri', p.soc, '%')
    + kort('Köpa', impNu === null ? '–' : kr(impNu), 'kr', spann(DBG && DBG.imp))
    + kort('Sälja', expNu === null ? '–' : kr(expNu), 'kr', spann(DBG && DBG.exp));

  const i = PLAN.findIndex(e => e.mode !== p.mode || e.power !== p.power);
  document.getElementById('next').innerHTML = i < 0
    ? 'Ingen ändring inom horisonten.'
    : `Nästa byte <b>${qT(PLAN[i].q)}</b> till <b>${PLAN[i].mode}${PLAN[i].power ? ' ' + PLAN[i].power + ' kW' : ''}</b>`;
}


// ---------- Ekonomi ----------
// Dagens utfall ur loggen, for de kvartar som passerat. Samma uppdelning
// som DP:s dygn: kopt, salt, slitage, vad det kostat utan batteri, och
// forandringen i batteriets energi vardesatt till terminalpriset.
function utfallIdag(kap, smin, term){
  if (!DBG) return null;
  const idag = new Date().toLocaleDateString('sv-SE');
  const cq = DBG.currentQuarter || 0;
  const n = x => (x === '' || x === null || x === undefined) ? 0 : +x;
  const rader = (UTFALL || []).filter(r => String(r.dygn) === idag && +r.kvart < cq)
                              .sort((a, b) => +a.kvart - +b.kvart);
  if (!rader.length) return null;
  const kwh = s => Math.max(0, s - smin) / 100 * kap;
  let kop = 0, salj = 0, slit = 0, utan = 0;
  rader.forEach(r => {
    const pv = n(r.pv), bi = n(r.battIn), bu = n(r.battUt), im = n(r.import), ex = n(r.export);
    const pI = n(r.impPris), pE = n(r.expPris);
    const last = pv + im + bu - bi - ex;
    kop  += im * pI;
    salj += ex * pE;
    slit += n(r.slitage);
    utan += Math.max(0, last - pv) * pI - Math.max(0, pv - last) * pE;
  });
  const f = rader[0], l = rader[rader.length - 1];
  // Laddnivan loggas i slutet av kvarten; borjan av forsta kvarten raknas
  // tillbaka med batteriets in- och utflode.
  const socStart = n(f.soc) - (n(f.battIn) * 0.975 - n(f.battUt) / 0.975) / kap * 100;
  const socSlut  = n(l.soc);
  const lager = (kwh(socSlut) - kwh(socStart)) * term;
  return { namn: 'Idag hittills, utfall', kop, salj, slit, utan, socStart, socSlut, lager,
           vinst: utan - (kop - salj + slit) + lager, saknas: cq - rader.length };
}

function ritaEkonomi(){
  const el = document.getElementById('econ');
  const e = DBG && DBG.ekonomi;
  if (!e || !e.dagar) { el.innerHTML = ''; return; }
  const kap = e.kapKwh || 24.3, smin = (e.socMin !== undefined ? e.socMin : 3);
  const term = (e.termPris !== undefined ? e.termPris : (DBG.termPrice || 0));
  const harVinst = e.dagar.every(d => d.vinst !== undefined);

  const seg = [];
  if (VY !== 'imorgon') {
    const u = utfallIdag(kap, smin, term);
    if (u) seg.push(u);
    const d0 = e.dagar.find(d => d.dag === 0);
    if (d0) seg.push({ namn: 'Resten av idag, plan', ...d0 });
  }
  if (VY !== 'idag') {
    const d1 = e.dagar.find(d => d.dag === 1);
    const prog1 = (PLAN || []).some(p => p.day === 1 && p.prog);
    if (d1) seg.push({ namn: prog1 ? 'Imorgon, plan på prisprognos' : 'Imorgon, plan', ...d1 });
  }
  if (!seg.length) {
    el.innerHTML = `<div class="note">${VY === 'imorgon' ? 'Morgondagens priser är inte publicerade än.' : 'Ingen data.'}</div>`;
    return;
  }

  const rad = s => {
    const netto = s.kop - s.salj + s.slit;
    return `<div class="sub">${s.namn}: köpt <b>${kr(s.kop)}</b>, sålt <b>${kr(s.salj)}</b>, `
      + `slitage <b>${kr(s.slit)}</b> &rarr; netto <b style="color:${netto <= 0 ? 'var(--self)' : 'var(--fg)'}">${kr(netto)}</b> kr`
      + (s.vinst !== undefined
          ? `. Batteriets energi ${s.lager >= 0 ? '+' : ''}${kr(s.lager)} kr, vinst <b>${kr(s.vinst)}</b> kr`
          : '')
      + (s.saknas ? `. ${s.saknas} kvartar saknas i loggen` : '')
      + `</div>`;
  };
  const summa = seg.reduce((a, s) => a + (s.vinst || 0), 0);
  const period = VY === 'idag' ? 'idag' : VY === 'imorgon' ? 'imorgon' : 'idag och imorgon';
  const self = VY === 'bada'
    ? `<div class="sub">Mot bara självförbrukning, planen från nu: <b>${kr(e.vinstMotSelf)}</b> kr.</div>` : '';

  el.innerHTML = `<div class="kpi stor"><div class="k">Vinst mot utan batteri, ${period}</div>`
    + (harVinst ? `<div class="v">${kr(summa)}<span class="u">kr</span></div>`
                : `<div class="v">${kr(e.vinstMotUtan)}<span class="u">kr</span></div>`
                  + `<div class="sub">Uppdela per dygn kräver den nya versionen av DP_EMS; visar hela horisonten.</div>`)
    + seg.map(rad).join('') + self + `</div>`;
  document.getElementById('econnote').textContent =
    'Netto är köpt minus sålt plus slitage. Vinsten jämför med vad samma förbrukning och sol hade kostat utan batteri. '
  + 'Förändringen i batteriets energi under perioden värderas till terminalpriset, annars skulle en period som '
  + 'tömmer batteriet se lönsammare ut än den är och en period som fyller det olönsam. Dygnen summerar därför till '
  + 'hela horisontens vinst. Utfallet för idag kommer ur loggen.';
}

// ---------- Timme för timme ----------
function ritaTimmar(){
  const grupper = [];
  PLAN.forEach(e => {
    const nyckel = e.day + ':' + Math.floor(e.q / 4);
    let g = grupper[grupper.length - 1];
    if (!g || g.nyckel !== nyckel) { g = { nyckel, day:e.day, h:Math.floor(e.q/4), poster:[] }; grupper.push(g); }
    g.poster.push(e);
  });
  document.getElementById('timmar').innerHTML = grupper.map(g => {
    const sista = g.poster[g.poster.length - 1];
    const lagen = [...new Set(g.poster.map(p => p.mode))];
    const etikett = lagen.map(m => badge(m)).join(' ');
    const dag = g.day ? (['','imorgon','övermorgon'][g.day] || 'dag '+g.day) + ' ' : '';
    return `<details class="timrad"><summary><span class="tid">${dag}${String(g.h).padStart(2,'0')}:00</span>`
         + `<span>${etikett}</span><span class="soc">${sista.soc} %</span></summary>`
         + `<table class="rows">` + g.poster.map(p =>
             `<tr><td class="t">${qT(p.q)}</td><td>${badge(p.mode, p.power)}</td>`
           + `<td style="color:var(--now);font-size:11px">${p.noImp === false ? 'nätköp' : ''}</td>`
           + `<td class="s">${p.soc} %</td></tr>`).join('') + `</table></details>`;
  }).join('');
}

// ---------- Priser och effekter ----------
// Ritar i en behallare med egen tooltip. bars ritas som staplar, lines som linjer.
function ritaChart(elId, cfg){
  const W=720, H=cfg.hojd||130, L=30, R=6, T=8, B=18;
  const lines = cfg.lines||[];
  const alla = [].concat(cfg.bars?cfg.bars.v:[], ...lines.map(l=>l.v)).filter(v=>v!==null && v!==undefined && !isNaN(v));
  const lo = Math.min(0, ...alla), hi = Math.max(...alla, .001);
  const n = Math.max(cfg.bars?cfg.bars.v.length:0, ...lines.map(l=>l.v.length));
  const step = (W-L-R)/n;
  const xc = i => L + step*(i+.5);
  const y  = v => T + (H-T-B)*(1-(v-lo)/((hi-lo)||1));

  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px">`;
  s += `<text x="0" y="${y(hi)+4}" fill="var(--muted)" font-size="10">${hi.toFixed(1)}</text>`;
  s += `<text x="0" y="${y(lo)+4}" fill="var(--muted)" font-size="10">${lo.toFixed(1)}</text>`;
  s += `<line x1="${L}" y1="${y(Math.max(lo,0))}" x2="${W-R}" y2="${y(Math.max(lo,0))}" stroke="var(--border)"/>`;
  if (cfg.bars){
    const bw = Math.max(.8, step*.8), y0 = y(Math.max(lo,0));
    cfg.bars.v.forEach((v,i) => {
      if (v === null || v === undefined || isNaN(v)) return;
      const yy = y(v);
      s += `<rect x="${(xc(i)-bw/2).toFixed(2)}" y="${Math.min(yy,y0).toFixed(1)}" `
         + `width="${bw.toFixed(2)}" height="${Math.max(.8,Math.abs(y0-yy)).toFixed(1)}" `
         + `fill="${cfg.bars.c}" opacity="${cfg.bars.svag && cfg.bars.svag[i] ? '.4' : '.85'}"/>`;
    });
  }
  lines.forEach(se => {
    let d = '', ny = true;
    se.v.forEach((v,i) => {
      if (v === null || v === undefined || isNaN(v)) { ny = true; return; }
      d += `${ny?'M':'L'}${xc(i).toFixed(1)},${y(v).toFixed(1)} `; ny = false;
    });
    s += `<path d="${d}" fill="none" stroke="${se.c}" stroke-width="1.8"${se.dash ? ' stroke-dasharray="4 3"' : ''}/>`;
  });
  if (cfg.nu !== undefined && cfg.nu >= 0)
    s += `<line x1="${(L+step*cfg.nu).toFixed(1)}" y1="${T}" x2="${(L+step*cfg.nu).toFixed(1)}" y2="${H-B}" stroke="var(--now)" stroke-width="2"/>`;
  (cfg.times||[]).forEach((t,i) => { if (t)
    s += `<text x="${xc(i).toFixed(1)}" y="${H-3}" fill="var(--muted)" font-size="13" text-anchor="middle">${t}</text>`; });
  s += '</svg>';

  const leg = (cfg.bars?[cfg.bars]:[]).concat(lines)
    .map(x => `<span><i style="background:${x.c}"></i>${x.n}</span>`).join('');
  const el = document.getElementById(elId);
  el.innerHTML = `<div class="chart" style="margin:0"><div class="cursor"></div>${s}</div>`
               + `<div class="legend">${leg}</div><div class="readout"></div>`;

  const box = el.querySelector('.chart');
  const cur = el.querySelector('.cursor');
  const out = el.querySelector('.readout');
  const serier = (cfg.bars?[cfg.bars]:[]).concat(lines);
  const visaIndex = i => {
    out.innerHTML = `<b>${(cfg.times2&&cfg.times2[i])||''}</b>`
      + serier.map(se => `<span><i style="background:${se.c};display:inline-block;width:8px;`
        + `height:8px;border-radius:2px;margin-right:4px"></i>${se.n} <b>${(se.v[i]===null||se.v[i]===undefined)?'–':(+se.v[i]).toFixed(2)}</b></span>`).join('')
      + (cfg.etikett && cfg.etikett[i] ? `<span>${cfg.etikett[i]}</span>` : '');
  };
  const peka = ev => {
    const r = box.getBoundingClientRect();
    const px = (ev.touches?ev.touches[0].clientX:ev.clientX) - r.left - 10;
    const frac = (px/(r.width-20)*W - L)/(W-L-R);
    const i = Math.max(0, Math.min(n-1, Math.floor(frac*n)));
    visaIndex(i);
    cur.style.display='block'; cur.style.left=(px+10)+'px';
  };
  box.onmousemove=peka; box.ontouchstart=peka; box.ontouchmove=peka;
  const start = (cfg.nu !== undefined && cfg.nu >= 0) ? cfg.nu : 0;
  box.onmouseleave=()=>{ cur.style.display='none'; visaIndex(start); };
  visaIndex(start);
}

function miniChart(serier, times, hojd){
  const W = 720, H = hojd || 120, L = 30, R = 6, T = 8, B = 18;
  const alla = serier.flatMap(s => s.v);
  const lo = Math.min(0, ...alla), hi = Math.max(...alla, .001);
  const n = Math.max(...serier.map(s => s.v.length));
  const x = i => L + (W-L-R) * i / Math.max(1, n-1);
  const y = v => T + (H-T-B) * (1 - (v-lo)/((hi-lo)||1));
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px">`;
  s += `<text x="0" y="${y(hi)+4}" fill="var(--muted)" font-size="10">${hi.toFixed(1)}</text>`;
  s += `<text x="0" y="${y(lo)+4}" fill="var(--muted)" font-size="10">${lo.toFixed(1)}</text>`;
  s += `<line x1="${L}" y1="${y(lo)}" x2="${W-R}" y2="${y(lo)}" stroke="var(--border)"/>`;
  serier.forEach(se => {
    const d = se.v.map((v,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${se.c}" stroke-width="1.8"/>`;
  });
  (times||[]).forEach((t,i) => { if (t) s += `<text x="${x(i).toFixed(1)}" y="${H-4}" fill="var(--muted)" font-size="10" text-anchor="middle">${t}</text>`; });
  s += '</svg>';
  const leg = serier.map(se => `<span><i style="background:${se.c}"></i>${se.n}</span>`).join('');
  return s + `<div class="legend">${leg}</div>`;
}

function ritaPriser(){
  const el = document.getElementById('priser');
  const rows = vyRader();
  if (!rows.length) { el.innerHTML = '<div class="note">Inga priser för vald period.</div>'; return; }
  const harProg = rows.some(r => r.prog);
  el.innerHTML = '<div class="note">Pris, kr/kWh. Före den orange linjen de priser som gällde, efter den kommande.'
    + (harProg ? ' Ljusa staplar och streckad linje är prognos, eftersom morgondagens priser inte är publicerade än.' : '')
    + '</div><div id="ch-pris"></div>';
  const lines = [{ n:'export', v: rows.map(r => r.prog ? null : r.exp), c:'var(--self)' }];
  if (harProg) lines.push({ n:'export, prognos', dash: true, c:'var(--self)',
    v: rows.map((r, i) => (r.prog || (rows[i+1] && rows[i+1].prog)) ? r.exp : null) });
  ritaChart('ch-pris', {
    bars:  { n:'import', v: rows.map(r => r.imp), c:'var(--discharge)', svag: rows.map(r => r.prog) },
    lines,
    etikett: rows.map(r => r.prog ? 'prisprognos' : ''),
    times:  rows.map(r => r.k % 12 === 0 ? qH(r.k) : ''),
    times2: rows.map(r => kTid(r.k)),
    nu: nuIndex(rows), hojd: 130,
  });
}

// ---------- Utfall och plan, fran i dag 00:00 ----------
// Passerade kvartar tas ur loggen i Google-arket, resten ur planen.
// Loggen anger energi per kvart i kWh; har omraknat till kW.
function byggDygn(){
  if (!PLAN || !DBG) return [];
  const cq   = DBG.currentQuarter || 0;
  const idag = new Date().toLocaleDateString('sv-SE');
  const utf  = {};
  (UTFALL || []).forEach(r => { if (String(r.dygn) === idag) utf[+r.kvart] = r; });
  const n = x => (x === '' || x === null || x === undefined) ? 0 : +x;
  const rows = [];
  for (let k = 0; k < cq; k++) {
    const r = utf[k];
    if (!r) { rows.push({ k, faktisk:true, sol:null, batt:null, grid:null, last:null, soc:null, mode:null, imp:null, exp:null }); continue; }
    const pv = n(r.pv)*4, bi = n(r.battIn)*4, bu = n(r.battUt)*4, im = n(r.import)*4, ex = n(r.export)*4;
    rows.push({ k, faktisk:true, sol:pv, batt:bi-bu, grid:im-ex, last:pv+im+bu-bi-ex, soc:n(r.soc),
                mode: r.lage || null, power: null,
                imp: r.impPris === '' ? null : n(r.impPris), exp: r.expPris === '' ? null : n(r.expPris) });
  }
  PLAN.forEach((e,i) => rows.push({
    k: cq+i, faktisk:false,
    sol: DBG.solar ? DBG.solar[i] : null, last: DBG.load ? DBG.load[i] : null,
    batt: (e.b === undefined ? null : e.b), grid: (e.g === undefined ? null : e.g), soc: e.soc,
    mode: e.mode, power: e.power, prog: !!e.prog,
    imp: DBG.imp ? DBG.imp[i] : null, exp: DBG.exp ? DBG.exp[i] : null,
  }));
  return rows;
}

// Vyval: idag, imorgon eller bada. Sparas i webblasaren.
let VY = 'bada';
try { VY = localStorage.getItem('dpems_vy') || 'bada'; } catch(e){}
function vyRader(){
  const rows = byggDygn();
  if (VY === 'idag')    return rows.filter(r => r.k < 96);
  if (VY === 'imorgon') return rows.filter(r => r.k >= 96);
  return rows;
}
function valjVy(v){
  VY = v;
  try { localStorage.setItem('dpems_vy', v); } catch(e){}
  document.querySelectorAll('#vy button').forEach(b => b.classList.toggle('aktiv', b.dataset.vy === v));
  ritaPriser(); ritaFloden(); ritaEkonomi();
}
// Index for nu-linjen inom vyn, eller -1 om nu inte ligger i vyn
const nuIndex = rows => DBG ? rows.findIndex(r => r.k === (DBG.currentQuarter || 0)) : -1;
const kTid = k => (Math.floor(k/96) ? 'imorgon ' : '') + qT(k % 96);

// ---------- Energifloden ----------
// Staplar: kallor uppat (sol, batteri som laddar ur, natimport),
// mottagare nedat (batteri som laddar, export). Differensen ar forbrukningen.
function ritaFloden(){
  const el = document.getElementById('floden');
  const rows = vyRader();
  if (!rows.length) {
    el.innerHTML = `<div class="note">${VY === 'imorgon' ? 'Morgondagens priser är inte publicerade än, de kommer kring 13.' : 'Ingen data.'}</div>`;
    return;
  }
  // B rymmer lagesremsan (REMSA) och klockslagen under den
  const REMSA = 12, W=720, H=214, L=30, R=30, T=8, B=18+REMSA+4;
  const n = rows.length, step = (W-L-R)/n, bw = Math.max(.8, step*.82);
  const xc = i => L + step*(i+.5);
  const del = r => ({
    sol: Math.max(0, r.sol||0),
    ur:  Math.max(0, -(r.batt||0)),
    imp: Math.max(0, r.grid||0),
    in:  Math.max(0, r.batt||0),
    ut:  Math.max(0, -(r.grid||0)),
  });
  let hi = 0.5, lo = -0.5;
  rows.forEach(r => { const d = del(r); hi = Math.max(hi, d.sol+d.ur+d.imp, r.last||0); lo = Math.min(lo, -(d.in+d.ut)); });
  const y  = v => T + (H-T-B) * (1 - (v-lo)/(hi-lo));
  const ys = s => T + (H-T-B) * (1 - s/100);
  const nu = nuIndex(rows);

  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px">`;
  s += `<line x1="${L}" y1="${y(0)}" x2="${W-R}" y2="${y(0)}" stroke="var(--border)"/>`;
  s += `<text x="0" y="${y(hi)+4}" fill="var(--muted)" font-size="10">${hi.toFixed(0)}</text>`;
  s += `<text x="0" y="${y(lo)+4}" fill="var(--muted)" font-size="10">${lo.toFixed(0)}</text>`;
  s += `<text x="${W-R+4}" y="${ys(100)+4}" fill="var(--muted)" font-size="10">100%</text>`;
  s += `<text x="${W-R+4}" y="${ys(0)}" fill="var(--muted)" font-size="10">0%</text>`;

  rows.forEach((r,i) => {
    if (r.sol === null && r.batt === null) return;
    const d = del(r), op = r.faktisk ? 0.95 : 0.5, x = (xc(i)-bw/2).toFixed(2);
    let upp = 0, ned = 0;
    const stapel = (v, farg, uppat) => {
      if (v <= 0.01) return;
      const a = uppat ? upp : ned, b = uppat ? upp + v : ned - v;
      const y1 = y(uppat ? b : a), y2 = y(uppat ? a : b);
      s += `<rect x="${x}" y="${y1.toFixed(1)}" width="${bw.toFixed(2)}" height="${Math.max(.6,y2-y1).toFixed(1)}" fill="${farg}" opacity="${op}"/>`;
      if (uppat) upp = b; else ned = b;
    };
    stapel(d.sol, 'var(--sol)', true);
    stapel(d.ur,  'var(--charge)', true);
    stapel(d.imp, 'var(--discharge)', true);
    stapel(d.in,  'var(--charge)', false);
    stapel(d.ut,  'var(--self)', false);
  });

  // Forbrukning och laddniva
  const linje = (fn, farg, streck, fran, till) => {
    let d = '', ny = true;
    for (let i = fran; i < till; i++) {
      const v = fn(rows[i]);
      if (v === null || v === undefined || isNaN(v)) { ny = true; continue; }
      d += `${ny?'M':'L'}${xc(i).toFixed(1)},${v.toFixed(1)} `; ny = false;
    }
    if (d) s += `<path d="${d}" fill="none" stroke="${farg}" stroke-width="1.8"${streck?' stroke-dasharray="4 3"':''}/>`;
  };
  const gr = nu < 0 ? (rows[0] && rows[0].faktisk ? n : 0) : nu;
  linje(r => r.last === null ? null : y(r.last), 'var(--last)', false, 0, Math.min(n, gr+1));
  linje(r => r.last === null ? null : y(r.last), 'var(--last)', true,  Math.max(0, gr), n);
  linje(r => r.soc  === null ? null : ys(r.soc), 'var(--self)', false, 0, Math.min(n, gr+1));
  linje(r => r.soc  === null ? null : ys(r.soc), 'var(--self)', true,  Math.max(0, gr), n);

  // Lagesremsa: utfall for passerade kvartar, plan darefter
  const yR = H - B + 4;
  rows.forEach((r,i) => {
    if (!r.mode) return;
    s += `<rect x="${(L+step*i).toFixed(2)}" y="${yR}" width="${(step+.4).toFixed(2)}" height="${REMSA}" `
       + `fill="${F[r.mode]||'var(--muted)'}" opacity="${r.faktisk ? 1 : 0.55}"/>`;
  });

  rows.forEach((r,i) => {
    if (r.k % 96 === 0 && i > 0) s += `<line x1="${xc(i)-step/2}" y1="${T}" x2="${xc(i)-step/2}" y2="${H-B}" stroke="var(--fg)" opacity=".35"/>`;
    if (r.k % 12 === 0) s += `<text x="${xc(i).toFixed(1)}" y="${H-3}" fill="var(--muted)" font-size="13" text-anchor="middle">${qH(r.k)}</text>`;
  });
  if (nu >= 0) s += `<line x1="${(L+step*nu).toFixed(1)}" y1="${T}" x2="${(L+step*nu).toFixed(1)}" y2="${H-B}" stroke="var(--now)" stroke-width="2"/>`;
  s += '</svg>';

  const leg = [['Sol','var(--sol)'],['Batteri','var(--charge)'],['Import','var(--discharge)'],['Export','var(--self)']]
    .map(([t,c]) => `<span><i style="background:${c}"></i>${t}</span>`).join('')
    + `<span style="color:var(--last)">— Förbrukning</span>`
    + `<span style="color:var(--self)">— Laddnivå</span>`;
  const legLage = ['Self','Absorb','Cover','Stop','Charge','Discharge']
    .map(m => `<span><i style="background:${F[m]}"></i>${m}</span>`).join('');

  el.innerHTML = `<div class="chart" style="margin:0"><div class="cursor"></div>${s}</div>`
               + `<div class="legend">${leg}</div>`
               + `<div class="legend" style="margin-top:2px">${legLage}</div><div class="readout"></div>`
               + `<div class="note">Staplar uppåt är varifrån strömmen kommer, nedåt vart överskottet går. `
               + `Remsan under visar läget. Före den orange linjen visas utfall ur loggen, efter den planen.</div>`;

  const box = el.querySelector('.chart'), cur = el.querySelector('.cursor'), out = el.querySelector('.readout');
  const f = v => (v === null || v === undefined) ? '–' : (+v).toFixed(2);
  const visa = i => {
    const r = rows[i];
    const imp = r.grid === null ? null : Math.max(0, r.grid);
    const exp = r.grid === null ? null : Math.max(0, -r.grid);
    out.innerHTML = `<b>${kTid(r.k)}</b>${r.mode ? badge(r.mode, r.power) : ''}<span>${r.faktisk ? 'utfall' : (r.prog ? 'plan, prisprognos' : 'plan')}</span>`
      + `<span style="color:var(--sol)">sol <b>${f(r.sol)}</b></span>`
      + `<span style="color:var(--charge)">batteri <b>${f(r.batt)}</b></span>`
      + `<span style="color:var(--discharge)">import <b>${f(imp)}</b></span>`
      + `<span style="color:var(--self)">export <b>${f(exp)}</b></span>`
      + `<span style="color:var(--last)">förbrukning <b>${f(r.last)}</b></span>`
      + `<span style="color:var(--self)">SoC <b>${r.soc === null ? '–' : r.soc + ' %'}</b></span>`;
  };
  const peka = ev => {
    const rc = box.getBoundingClientRect();
    const px = (ev.touches?ev.touches[0].clientX:ev.clientX) - rc.left - 10;
    const frac = (px/(rc.width-20)*W - L)/(W-L-R);
    const i = Math.max(0, Math.min(n-1, Math.floor(frac*n)));
    visa(i); cur.style.display='block'; cur.style.left=(px+10)+'px';
  };
  box.onmousemove=peka; box.ontouchstart=peka; box.ontouchmove=peka;
  box.onmouseleave=()=>{ cur.style.display='none'; visa(Math.max(0, nu)); };
  visa(Math.max(0, nu));
  document.querySelectorAll('#vy button').forEach(b => b.classList.toggle('aktiv', b.dataset.vy === VY));
}

// ---------- Modeller ----------
function ritaModeller(){
  if (!DBG) return;
  const c = [];
  const ch = (k,v) => c.push(`<span class="chip"><b>${k}</b>${v}</span>`);
  if (DBG.sol)  { ch('sol idag', DBG.sol.faktorIdag); ch('sol lång', DBG.sol.faktorLang);
                  ch('verklig/prognos', DBG.sol.idagVerklig + ' / ' + DBG.sol.idagPrognos + ' kWh'); }
  if (DBG.prop) { ch('andel', DBG.prop.andel); ch('överskott', DBG.prop.overskott + ' kWh'); }
  if (DBG.matt) { ch('baslast nu', DBG.matt.baslastNu + ' kW'); ch('obs', DBG.matt.baslastObs);
                  ch('varmvatten', DBG.matt.vvDygn + ' kWh/dygn'); }
  if (DBG.ev)   { ch('elbil', DBG.ev.mode + (DBG.ev.tillganglig ? '' : ' (otillgänglig)')); }
  if (DBG.termPrice !== undefined) ch('terminalpris', kr(DBG.termPrice) + ' kr');
  if (DBG.ms !== undefined) ch('beräkning', DBG.ms + ' ms');
  document.getElementById('modeller').innerHTML = `<div class="chips">${c.join('')}</div>`;
}

// ---------- Exekveringslogg ----------
const EX = /^(\d{2}:\d{2}) plan (\w+)(?: ([\d.]+))?( noImp)? -> (\w+)(?: ([\d.]+))? \| PV ([-\d.]+) last ([-\d.]+) batt ([-\d.]+)(?: ev ([-\d.]+))? = ([-\d.]+)(?: \| (.*))?$/;
function ritaLogg(text){
  const rader = String(text||'').split(/\n|(?=\d{2}:\d{2} plan )/).map(s=>s.trim()).filter(Boolean)
    .map(s => s.match(EX)).filter(Boolean);
  if (!rader.length) { document.getElementById('exlogg').innerHTML = '<div class="note">Ingen logg.</div>'; return; }
  document.getElementById('exlogg').innerHTML =
    '<table class="rows">' + rader.slice(0,40).map(m =>
      `<tr><td class="t">${m[1]}</td><td>${badge(m[5], m[6])}</td>`
    + `<td class="s">${(+m[11]).toFixed(1)}</td>`
    + `<td style="color:var(--muted);font-size:11px">${m[12]||''}</td></tr>`).join('')
    + '</table><div class="note">Senaste 40 minuterna. Kolumnen visar överskott i kW.</div>';
}

// ---------- Rendering ----------
function renderaAllt(planText, dbgText, exText){
  try { PLAN = JSON.parse(planText).plan; } catch(e) { PLAN = null; }
  try { DBG = JSON.parse(dbgText); } catch(e) { DBG = null; }
  if (!PLAN || !PLAN.length) return;
  document.getElementById('app').style.display = 'block';
  ritaStatus(); ritaEkonomi(); ritaTimmar(); ritaPriser(); ritaFloden(); ritaModeller(); ritaLogg(exText);
}
function renderaFranFalt(){
  renderaAllt(document.getElementById('raw-plan').value,
              document.getElementById('raw-debug').value,
              document.getElementById('raw-exec').value);
}

// ---------- Anslutning ----------
const NAMN = { plan:'DP_Plan', debug:'DP_Debug', exec:'DP_Exec_Log' };
function status(t, k){ const e=document.getElementById('conn-sum'); e.textContent=t; e.className=k||''; }

async function hamta(bas, token, variant){
  const url = bas + '/api/manager/logic/variable' + (variant==='query' ? '?token='+encodeURIComponent(token) : '');
  const opt = variant==='query' ? {} : { headers:{ Authorization:'Bearer '+token } };
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

// Utfallet ur Google-arket. Misslyckas det behalls det senaste, och
// diagrammen visar da bara planen for de kvartar som saknas.
async function hamtaUtfall(){
  const url = document.getElementById('c-logurl').value.trim();
  const key = document.getElementById('c-logkey').value.trim();
  if (!url || !key) return;
  const idag = new Date().toLocaleDateString('sv-SE');
  try {
    const r = await fetch(`${url}?nyckel=${encodeURIComponent(key)}&vy=kvart&fran=${idag}`);
    const j = await r.json();
    if (Array.isArray(j.rader)) UTFALL = j.rader;
  } catch(e) { /* behall senaste */ }
}

async function hamtaNu(){
  const bas = document.getElementById('c-url').value.trim().replace(/\/+$/,'');
  const token = document.getElementById('c-token').value.trim();
  if (!bas || !token) { status('fyll i adress och token','bad'); return; }
  let cfg = {}; try { cfg = JSON.parse(localStorage.getItem('dpems'))||{}; } catch(e){}
  const varianter = cfg.variant ? [cfg.variant, cfg.variant==='query'?'header':'query'] : ['query','header'];
  const fel = [];
  for (const v of varianter){
    try {
      const data = await hamta(bas, token, v);
      const val = {}; Object.values(data).forEach(x => val[x.name] = x.value);
      document.getElementById('raw-plan').value  = val[NAMN.plan]  || '';
      document.getElementById('raw-debug').value = val[NAMN.debug] || '';
      document.getElementById('raw-exec').value  = val[NAMN.exec]  || '';
      await hamtaUtfall();
      renderaFranFalt();
      try {
        const gammal = JSON.parse(localStorage.getItem('dpems')) || {};
        localStorage.setItem('dpems', JSON.stringify({ ...gammal, bas, token, variant:v }));
      } catch(e){}
      const n = new Date();
      status(`uppdaterad ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`,'ok');
      document.getElementById('conn-log').innerHTML = '';
      return;
    } catch(e){ fel.push(`${v}: ${e.message}`); }
  }
  status('ingen kontakt','bad');
  document.getElementById('conn-log').innerHTML = fel.join('<br>');
  document.getElementById('d-conn').open = true;
}

function glomUppgifter(){
  try { localStorage.removeItem('dpems'); } catch(e){}
  document.getElementById('c-url').value=''; document.getElementById('c-token').value='';
  status('uppgifterna borttagna','');
}
function skapaBokmarke(){
  const bas=document.getElementById('c-url').value.trim().replace(/\/+$/,'');
  const token=document.getElementById('c-token').value.trim();
  if(!bas||!token){ status('fyll i adress och token','bad'); return; }
  document.getElementById('conn-log').innerHTML =
    'Spara som privat bokmärke. Länken innehåller din token:<br><span style="word-break:break-all">'
    + location.origin + location.pathname + '#bas=' + encodeURIComponent(bas) + '&token=' + encodeURIComponent(token)
    + '</span>';
}
function sparaFalt(){
  let cfg={}; try{ cfg=JSON.parse(localStorage.getItem('dpems'))||{}; }catch(e){}
  cfg.bas = document.getElementById('c-url').value.trim().replace(/\/+$/,'');
  cfg.token = document.getElementById('c-token').value.trim();
  cfg.logUrl = document.getElementById('c-logurl').value.trim();
  cfg.logKey = document.getElementById('c-logkey').value.trim();
  try { localStorage.setItem('dpems', JSON.stringify(cfg)); } catch(e){}
}

window.addEventListener('load', () => {
  let cfg=null; try{ cfg=JSON.parse(localStorage.getItem('dpems')); }catch(e){}
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('bas') && h.get('token')){
    cfg = { bas:h.get('bas'), token:h.get('token'), variant: cfg && cfg.variant };
    try { localStorage.setItem('dpems', JSON.stringify(cfg)); } catch(e){}
    history.replaceState(null,'',location.pathname);
  }
  if (cfg){
    document.getElementById('c-url').value = cfg.bas || '';
    document.getElementById('c-token').value = cfg.token || '';
    document.getElementById('c-logurl').value = cfg.logUrl || '';
    document.getElementById('c-logkey').value = cfg.logKey || '';
    hamtaNu();
  } else {
    document.getElementById('d-conn').open = true;
  }
  document.querySelectorAll('#vy button').forEach(b => b.addEventListener('click', () => valjVy(b.dataset.vy)));
  document.getElementById('c-url').addEventListener('change', sparaFalt);
  document.getElementById('c-token').addEventListener('change', sparaFalt);
  document.getElementById('c-logurl').addEventListener('change', sparaFalt);
  document.getElementById('c-logkey').addEventListener('change', sparaFalt);
  setInterval(hamtaNu, 60000);
});
</script>
