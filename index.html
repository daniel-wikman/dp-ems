<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DP-EMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1016; --surface:#131a23; --surface2:#1a232e; --border:#243040;
    --fg:#dbe4f0; --muted:#7a8799;
    --self:#22c55e; --stop:#64748b; --charge:#3b82f6; --discharge:#ef4444;
    --now:#f59e0b;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:14px}
  h1{font-size:17px;font-weight:600;margin:0 0 12px}
  h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
     color:var(--muted);margin:22px 0 8px}

  /* Status */
  .status{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
  .status .kpi{padding:10px}
  .status .kpi .v{font-size:17px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 12px}
  .kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .kpi .v{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:500;margin-top:3px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .u{font-size:11px;color:var(--muted);margin-left:2px}
  .kpi .sub{font-size:11.5px;color:var(--muted);margin-top:5px;font-family:'Inter',sans-serif}
  .kpi .sub b{color:var(--fg);font-weight:500;font-family:'JetBrains Mono',monospace}
  .kpi .sub.total{border-top:1px solid var(--border);margin-top:7px;padding-top:6px;color:var(--fg)}
  .econ .kpi{grid-column:1/-1}
  .kpi.stor .v{font-size:26px}
  .next{margin-top:8px;font-size:13px;color:var(--muted)}
  .next b{color:var(--fg);font-weight:500}

  /* Diagram */
  .chart{background:var(--surface);border:1px solid var(--border);border-radius:9px;
         padding:10px 10px 6px;margin-top:6px;position:relative;touch-action:pan-y}
  .chart svg{display:block;width:100%;height:190px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);
          margin-top:6px;padding:0 2px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
  /* Avlasningsrad under diagrammet i stallet for en ruta ovanpa det */
  .readout{font-size:12.5px;font-family:'JetBrains Mono',monospace;color:var(--muted);
           padding:6px 2px 0;min-height:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .readout b{color:var(--fg);font-weight:500}
  .cursor{position:absolute;top:10px;bottom:24px;width:1px;background:var(--now);
          opacity:.75;pointer-events:none;display:none}

  /* Ekonomi */
  .econ{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

  /* Timlista */
  details{background:var(--surface);border:1px solid var(--border);border-radius:9px;
          margin-top:8px;overflow:hidden}
  details>summary{cursor:pointer;padding:11px 13px;font-size:14px;list-style:none;
                  display:flex;justify-content:space-between;align-items:center;gap:10px}
  /* Timraderna: fasta kolumner sa tid, lagen och SoC star i linje */
  .timrad>summary{display:grid;grid-template-columns:auto 1fr auto auto;gap:9px;align-items:center}
  .timrad>summary .tid{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:13px}
  .timrad>summary .soc{font-family:'JetBrains Mono',monospace;font-size:13px;text-align:right}
  details>summary::-webkit-details-marker{display:none}
  details>summary::after{content:'+';color:var(--muted);font-family:'JetBrains Mono',monospace}
  details[open]>summary::after{content:'−'}
  .inner{padding:0 13px 13px}
  .rows{width:100%;border-collapse:collapse;font-size:13px;
        font-family:'JetBrains Mono',monospace}
  .rows td{padding:5px 4px;border-top:1px solid var(--border)}
  .rows tr:first-child td{border-top:none}
  .rows .t{color:var(--muted);width:52px}
  .rows .s{text-align:right;width:46px}
  .badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;color:#06121a;
         font-family:'Inter',sans-serif;font-weight:500}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{background:var(--surface2);border:1px solid var(--border);border-radius:13px;
        padding:4px 10px;font-size:12px;font-family:'JetBrains Mono',monospace}
  .chip b{color:var(--muted);font-weight:400;font-family:'Inter',sans-serif;font-size:11px;margin-right:5px}
  textarea{width:100%;height:110px;background:var(--surface2);border:1px solid var(--border);
           border-radius:6px;color:var(--fg);padding:8px;font-family:'JetBrains Mono',monospace;
           font-size:11px;resize:vertical}
  input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;
        color:var(--fg);padding:9px 10px;font-family:'JetBrains Mono',monospace;font-size:12px}
  label{display:block;font-size:11px;color:var(--muted);margin:10px 0 3px;
        text-transform:uppercase;letter-spacing:.05em}
  button{background:var(--surface2);border:1px solid var(--border);border-radius:6px;
         color:var(--fg);padding:9px 13px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--muted)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px}
  .ok{color:var(--self)} .bad{color:var(--discharge)}
  .mono{font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.7}
  .note{font-size:11px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

<h1>DP-EMS</h1>

<div id="app" style="display:none">
  <div class="status" id="kpi"></div>
  <div class="next" id="next"></div>

  <h2>Planen, hela horisonten</h2>
  <div class="chart" id="chartbox">
    <div class="cursor" id="chart-cursor"></div>
    <div id="chart"></div>
    <div class="legend">
      <span><i style="background:var(--self)"></i>Self</span>
      <span><i style="background:var(--stop)"></i>Stop</span>
      <span><i style="background:var(--charge)"></i>Charge</span>
      <span><i style="background:var(--discharge)"></i>Discharge</span>
      <span style="color:var(--now)">| nu</span>
    </div>
  </div>
  <div class="readout" id="chart-readout"></div>

  <h2>Ekonomi över horisonten</h2>
  <div class="econ" id="econ"></div>
  <div class="note" id="econnote"></div>

  <h2>Detaljer</h2>
  <details id="d-timmar"><summary>Timme för timme<span></span></summary><div class="inner" id="timmar"></div></details>
  <details><summary>Priser och effekter</summary><div class="inner" id="priser"></div></details>
  <details><summary>Modeller och prognoser</summary><div class="inner" id="modeller"></div></details>
  <details><summary>Exekveringslogg</summary><div class="inner" id="exlogg"></div></details>
  <details><summary>Rådata</summary><div class="inner">
    <label>DP_Plan</label><textarea id="raw-plan"></textarea>
    <label>DP_Debug</label><textarea id="raw-debug"></textarea>
    <label>DP_Exec_Log</label><textarea id="raw-exec"></textarea>
    <div class="row"><button onclick="renderaFranFalt()">Rita om från fälten</button></div>
  </div></details>
</div>

<h2>Anslutning</h2>
<details id="d-conn">
  <summary><span id="conn-sum">Homey</span></summary>
  <div class="inner">
    <label>Adress</label>
    <input id="c-url" placeholder="https://xxxx.connect.athom.com">
    <label>Token</label>
    <input id="c-token" type="password" placeholder="API-nyckel med läsrätt på Logic">
    <div class="row">
      <button onclick="hamtaNu()">Hämta nu</button>
      <button onclick="glomUppgifter()">Glöm</button>
      <button onclick="skapaBokmarke()">Bokmärkeslänk</button>
    </div>
    <div class="mono" id="conn-log" style="margin-top:10px"></div>
    <div class="note">Adress och token sparas bara i den här webbläsaren.</div>
  </div>
</details>

</div>

<script>
const F = { Self:'var(--self)', Stop:'var(--stop)', Charge:'var(--charge)', Discharge:'var(--discharge)' };
const qT = q => `${String(Math.floor((((q%96)+96)%96)/4)).padStart(2,'0')}:${String(((q%4)+4)%4*15).padStart(2,'0')}`;
const kr = v => (v<0?'−':'') + Math.abs(v).toFixed(2).replace('.',',');
let PLAN = null, DBG = null;

function kort(k, v, u){
  return `<div class="kpi"><div class="k">${k}</div><div class="v">${v}<span class="u">${u||''}</span></div></div>`;
}
function badge(m, pw){
  return `<span class="badge" style="background:${F[m]||'var(--muted)'}">${m}${pw?' '+pw:''}</span>`;
}

// ---------- Status ----------
function ritaStatus(){
  const p = PLAN[0];
  const impNu = DBG && DBG.imp ? DBG.imp[0] : null;
  const expNu = DBG && DBG.exp ? DBG.exp[0] : null;
  document.getElementById('kpi').innerHTML =
      kort('Läge nu', p.mode + (p.power ? ' ' + p.power : ''), p.power ? 'kW' : '')
    + kort('Batteri', p.soc, '%')
    + kort('Köpa', impNu === null ? '–' : kr(impNu), 'kr')
    + kort('Sälja', expNu === null ? '–' : kr(expNu), 'kr');

  const i = PLAN.findIndex(e => e.mode !== p.mode || e.power !== p.power);
  document.getElementById('next').innerHTML = i < 0
    ? 'Ingen ändring inom horisonten.'
    : `Nästa byte <b>${qT(PLAN[i].q)}</b> till <b>${PLAN[i].mode}${PLAN[i].power ? ' ' + PLAN[i].power + ' kW' : ''}</b>`;
}

// ---------- Diagram ----------
function ritaDiagram(){
  const W = 720, H = 190, L = 26, R = 6, T = 8, B = 20;
  const n = PLAN.length;
  const x = i => L + (W - L - R) * i / n;
  const y = s => T + (H - T - B) * (1 - s / 100);
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;

  // lagesband
  PLAN.forEach((e, i) => {
    s += `<rect x="${x(i).toFixed(1)}" y="${T}" width="${((W-L-R)/n + .6).toFixed(2)}" `
       + `height="${H-T-B}" fill="${F[e.mode]||'var(--muted)'}" opacity="0.30"/>`;
  });

  // rutnat 0/50/100 %
  [0,50,100].forEach(v => {
    s += `<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--border)"/>`
       + `<text x="0" y="${y(v)+4}" fill="var(--muted)" font-size="10">${v}</text>`;
  });

  // dygnsgrans och klockslag var tredje timme
  PLAN.forEach((e, i) => {
    if (e.q === 0) s += `<line x1="${x(i).toFixed(1)}" y1="${T}" x2="${x(i).toFixed(1)}" y2="${H-B}" stroke="var(--fg)" opacity=".35"/>`;
    if (e.q % 12 === 0) s += `<text x="${x(i).toFixed(1)}" y="${H-6}" fill="var(--muted)" font-size="10" text-anchor="middle">${qT(e.q)}</text>`;
  });

  // SoC
  const d = PLAN.map((e,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(e.soc).toFixed(1)}`).join(' ');
  s += `<path d="${d}" fill="none" stroke="#e8f0ff" stroke-width="2"/>`;
  s += `<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="var(--now)" stroke-width="2"/>`;
  s += '</svg>';
  document.getElementById('chart').innerHTML = s;

  const box = document.getElementById('chartbox');
  const cur = document.getElementById('chart-cursor');
  const out = document.getElementById('chart-readout');
  const visaIndex = i => {
    const e = PLAN[i];
    const dag = ['idag','imorgon','övermorgon'][e.day] || ('dag ' + e.day);
    const imp = e.noImp === true ? 'utan nätköp'
              : e.noImp === false ? 'med nätköp' : '';
    out.innerHTML = `<b>${dag} ${qT(e.q)}</b>${badge(e.mode, e.power)}`
      + `<span>SoC <b>${e.soc} %</b></span>`
      + (imp ? `<span style="color:${e.noImp ? 'var(--self)' : 'var(--now)'}">${imp}</span>` : '');
  };
  const peka = ev => {
    const r = box.getBoundingClientRect();
    const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left - 10;
    const frac = (px / (r.width - 20) * W - L) / (W - L - R);
    const i = Math.max(0, Math.min(n - 1, Math.floor(frac * n)));
    visaIndex(i);
    cur.style.display = 'block';
    cur.style.left = (px + 10) + 'px';
  };
  box.onmousemove = peka; box.ontouchstart = peka; box.ontouchmove = peka;
  box.onmouseleave = () => { cur.style.display = 'none'; visaIndex(0); };
  visaIndex(0);
}

// ---------- Ekonomi ----------
function ritaEkonomi(){
  const e = DBG && DBG.ekonomi;
  if (!e) { document.getElementById('econ').innerHTML = ''; return; }
  const namn = ['Resten av idag','Imorgon','Övermorgon'];
  const dagar = e.dagar || [];
  const sum = f => dagar.reduce((a, d) => a + (d[f] || 0), 0);
  // Netto = kopt - salt + slitage. Positivt ar en kostnad, negativt en intakt.
  const rad = (etikett, kop, salj, slit, klass) => {
    const netto = kop - salj + slit;
    return `<div class="sub${klass || ''}">${etikett}: köpt <b>${kr(kop)}</b> kr, `
      + `sålt <b>${kr(salj)}</b> kr, slitage <b>${kr(slit)}</b> kr `
      + `&rarr; netto <b style="color:${netto <= 0 ? 'var(--self)' : 'var(--fg)'}">${kr(netto)}</b> kr</div>`;
  };

  const rader = dagar.map(d => rad(namn[d.dag] || ('Dag ' + d.dag), d.kop, d.salj, d.slit)).join('')
    + (dagar.length > 1 ? rad('Totalt', sum('kop'), sum('salj'), sum('slit'), ' total') : '');
  const jam = `<div class="sub total">Nettokostnad för perioden: <b>${kr(e.dpKostnad)}</b> kr. `
    + `Utan batteri <b>${kr(e.utanKostnad)}</b> kr, med bara självförbrukning <b>${kr(e.selfKostnad)}</b> kr `
    + `(vinst mot den: <b>${kr(e.vinstMotSelf)}</b> kr). `
    + `Batteriet slutar på <b>${e.dpSlutSoc} %</b>.</div>`;

  document.getElementById('econ').innerHTML =
    `<div class="kpi stor"><div class="k">Vinst mot utan batteri, hela horisonten</div>`
  + `<div class="v">${kr(e.vinstMotUtan)}<span class="u">kr</span></div>${rader}${jam}</div>`;
  document.getElementById('econnote').textContent =
    'Netto är köpt minus sålt plus slitage: positivt är en kostnad, negativt en nettointäkt. '
  + 'Vinsten avser hela horisonten och räknar in batteriets nivå vid slutet. Ett enskilt dygn '
  + 'går inte att räkna för sig, eftersom batteriet flyttar värde mellan dygnen.';
}

// ---------- Timme för timme ----------
function ritaTimmar(){
  const grupper = [];
  PLAN.forEach(e => {
    const nyckel = e.day + ':' + Math.floor(e.q / 4);
    let g = grupper[grupper.length - 1];
    if (!g || g.nyckel !== nyckel) { g = { nyckel, day:e.day, h:Math.floor(e.q/4), poster:[] }; grupper.push(g); }
    g.poster.push(e);
  });
  document.getElementById('timmar').innerHTML = grupper.map(g => {
    const sista = g.poster[g.poster.length - 1];
    const lagen = [...new Set(g.poster.map(p => p.mode))];
    const etikett = lagen.map(m => badge(m)).join(' ');
    const dag = g.day ? (['','imorgon','övermorgon'][g.day] || 'dag '+g.day) + ' ' : '';
    return `<details class="timrad"><summary><span class="tid">${dag}${String(g.h).padStart(2,'0')}:00</span>`
         + `<span>${etikett}</span><span class="soc">${sista.soc} %</span></summary>`
         + `<table class="rows">` + g.poster.map(p =>
             `<tr><td class="t">${qT(p.q)}</td><td>${badge(p.mode, p.power)}</td>`
           + `<td style="color:var(--now);font-size:11px">${p.noImp === false ? 'nätköp' : ''}</td>`
           + `<td class="s">${p.soc} %</td></tr>`).join('') + `</table></details>`;
  }).join('');
}

// ---------- Priser och effekter ----------
// Ritar i en behallare med egen tooltip. bars ritas som staplar, lines som linjer.
function ritaChart(elId, cfg){
  const W=720, H=cfg.hojd||130, L=30, R=6, T=8, B=18;
  const lines = cfg.lines||[];
  const alla = [].concat(cfg.bars?cfg.bars.v:[], ...lines.map(l=>l.v));
  const lo = Math.min(0, ...alla), hi = Math.max(...alla, .001);
  const n = Math.max(cfg.bars?cfg.bars.v.length:0, ...lines.map(l=>l.v.length));
  const step = (W-L-R)/n;
  const xc = i => L + step*(i+.5);
  const y  = v => T + (H-T-B)*(1-(v-lo)/((hi-lo)||1));

  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px">`;
  s += `<text x="0" y="${y(hi)+4}" fill="var(--muted)" font-size="10">${hi.toFixed(1)}</text>`;
  s += `<text x="0" y="${y(lo)+4}" fill="var(--muted)" font-size="10">${lo.toFixed(1)}</text>`;
  s += `<line x1="${L}" y1="${y(Math.max(lo,0))}" x2="${W-R}" y2="${y(Math.max(lo,0))}" stroke="var(--border)"/>`;
  if (cfg.bars){
    const bw = Math.max(.8, step*.8), y0 = y(Math.max(lo,0));
    cfg.bars.v.forEach((v,i) => {
      const yy = y(v);
      s += `<rect x="${(xc(i)-bw/2).toFixed(2)}" y="${Math.min(yy,y0).toFixed(1)}" `
         + `width="${bw.toFixed(2)}" height="${Math.max(.8,Math.abs(y0-yy)).toFixed(1)}" `
         + `fill="${cfg.bars.c}" opacity=".85"/>`;
    });
  }
  lines.forEach(se => {
    const d = se.v.map((v,i)=>`${i?'L':'M'}${xc(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${se.c}" stroke-width="1.8"/>`;
  });
  (cfg.times||[]).forEach((t,i) => { if (t)
    s += `<text x="${xc(i).toFixed(1)}" y="${H-4}" fill="var(--muted)" font-size="10" text-anchor="middle">${t}</text>`; });
  s += '</svg>';

  const leg = (cfg.bars?[cfg.bars]:[]).concat(lines)
    .map(x => `<span><i style="background:${x.c}"></i>${x.n}</span>`).join('');
  const el = document.getElementById(elId);
  el.innerHTML = `<div class="chart" style="margin:0"><div class="cursor"></div>${s}</div>`
               + `<div class="legend">${leg}</div><div class="readout"></div>`;

  const box = el.querySelector('.chart');
  const cur = el.querySelector('.cursor');
  const out = el.querySelector('.readout');
  const serier = (cfg.bars?[cfg.bars]:[]).concat(lines);
  const visaIndex = i => {
    out.innerHTML = `<b>${(cfg.times2&&cfg.times2[i])||''}</b>`
      + serier.map(se => `<span><i style="background:${se.c};display:inline-block;width:8px;`
        + `height:8px;border-radius:2px;margin-right:4px"></i>${se.n} <b>${(+se.v[i]).toFixed(2)}</b></span>`).join('');
  };
  const peka = ev => {
    const r = box.getBoundingClientRect();
    const px = (ev.touches?ev.touches[0].clientX:ev.clientX) - r.left - 10;
    const frac = (px/(r.width-20)*W - L)/(W-L-R);
    const i = Math.max(0, Math.min(n-1, Math.floor(frac*n)));
    visaIndex(i);
    cur.style.display='block'; cur.style.left=(px+10)+'px';
  };
  box.onmousemove=peka; box.ontouchstart=peka; box.ontouchmove=peka;
  box.onmouseleave=()=>{ cur.style.display='none'; visaIndex(0); };
  visaIndex(0);
}

function miniChart(serier, times, hojd){
  const W = 720, H = hojd || 120, L = 30, R = 6, T = 8, B = 18;
  const alla = serier.flatMap(s => s.v);
  const lo = Math.min(0, ...alla), hi = Math.max(...alla, .001);
  const n = Math.max(...serier.map(s => s.v.length));
  const x = i => L + (W-L-R) * i / Math.max(1, n-1);
  const y = v => T + (H-T-B) * (1 - (v-lo)/((hi-lo)||1));
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px">`;
  s += `<text x="0" y="${y(hi)+4}" fill="var(--muted)" font-size="10">${hi.toFixed(1)}</text>`;
  s += `<text x="0" y="${y(lo)+4}" fill="var(--muted)" font-size="10">${lo.toFixed(1)}</text>`;
  s += `<line x1="${L}" y1="${y(lo)}" x2="${W-R}" y2="${y(lo)}" stroke="var(--border)"/>`;
  serier.forEach(se => {
    const d = se.v.map((v,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${se.c}" stroke-width="1.8"/>`;
  });
  (times||[]).forEach((t,i) => { if (t) s += `<text x="${x(i).toFixed(1)}" y="${H-4}" fill="var(--muted)" font-size="10" text-anchor="middle">${t}</text>`; });
  s += '</svg>';
  const leg = serier.map(se => `<span><i style="background:${se.c}"></i>${se.n}</span>`).join('');
  return s + `<div class="legend">${leg}</div>`;
}

function ritaPriser(){
  const el = document.getElementById('priser');
  if (!DBG || !DBG.imp) { el.innerHTML = '<div class="note">Ingen debugdata.</div>'; return; }
  const cq = DBG.currentQuarter || 0;
  const tid  = DBG.imp.map((_,i) => ((cq+i) % 12 === 0) ? qT(cq+i) : '');
  const tid2 = DBG.imp.map((_,i) => qT(cq+i));

  el.innerHTML = '<div class="note">Pris, kr/kWh</div><div id="ch-pris"></div>'
    + (DBG.solar && DBG.load
        ? '<div class="note" style="margin-top:14px">Effekt, kW. Lasten är husets hela förbrukning: värmepump, varmvatten, avfuktare, baslast och elbil.</div>'
          + '<div id="ch-eff"></div>' : '');

  ritaChart('ch-pris', {
    bars:  { n:'import', v:DBG.imp, c:'var(--charge)' },
    lines: [{ n:'export', v:DBG.exp, c:'var(--self)' }],
    times: tid, times2: tid2, hojd: 130,
  });
  if (DBG.solar && DBG.load) {
    const lin = [{ n:'sol', v:DBG.solar, c:'var(--discharge)' },
                 { n:'last', v:DBG.load, c:'var(--charge)' }];
    if (DBG.surp) lin.push({ n:'överskott', v:DBG.surp, c:'var(--self)' });
    ritaChart('ch-eff', { lines: lin, times: tid, times2: tid2, hojd: 130 });
  }
}

// ---------- Modeller ----------
function ritaModeller(){
  if (!DBG) return;
  const c = [];
  const ch = (k,v) => c.push(`<span class="chip"><b>${k}</b>${v}</span>`);
  if (DBG.sol)  { ch('sol idag', DBG.sol.faktorIdag); ch('sol lång', DBG.sol.faktorLang);
                  ch('verklig/prognos', DBG.sol.idagVerklig + ' / ' + DBG.sol.idagPrognos + ' kWh'); }
  if (DBG.prop) { ch('andel', DBG.prop.andel); ch('överskott', DBG.prop.overskott + ' kWh'); }
  if (DBG.matt) { ch('baslast nu', DBG.matt.baslastNu + ' kW'); ch('obs', DBG.matt.baslastObs);
                  ch('varmvatten', DBG.matt.vvDygn + ' kWh/dygn'); }
  if (DBG.ev)   { ch('elbil', DBG.ev.mode + (DBG.ev.tillganglig ? '' : ' (otillgänglig)')); }
  if (DBG.termPrice !== undefined) ch('terminalpris', kr(DBG.termPrice) + ' kr');
  if (DBG.ms !== undefined) ch('beräkning', DBG.ms + ' ms');
  document.getElementById('modeller').innerHTML = `<div class="chips">${c.join('')}</div>`;
}

// ---------- Exekveringslogg ----------
const EX = /^(\d{2}:\d{2}) plan (\w+)(?: ([\d.]+))?( noImp)? -> (\w+)(?: ([\d.]+))? \| PV ([-\d.]+) last ([-\d.]+) batt ([-\d.]+)(?: ev ([-\d.]+))? = ([-\d.]+)(?: \| (.*))?$/;
function ritaLogg(text){
  const rader = String(text||'').split(/\n|(?=\d{2}:\d{2} plan )/).map(s=>s.trim()).filter(Boolean)
    .map(s => s.match(EX)).filter(Boolean);
  if (!rader.length) { document.getElementById('exlogg').innerHTML = '<div class="note">Ingen logg.</div>'; return; }
  document.getElementById('exlogg').innerHTML =
    '<table class="rows">' + rader.slice(0,40).map(m =>
      `<tr><td class="t">${m[1]}</td><td>${badge(m[5], m[6])}</td>`
    + `<td class="s">${(+m[11]).toFixed(1)}</td>`
    + `<td style="color:var(--muted);font-size:11px">${m[12]||''}</td></tr>`).join('')
    + '</table><div class="note">Senaste 40 minuterna. Kolumnen visar överskott i kW.</div>';
}

// ---------- Rendering ----------
function renderaAllt(planText, dbgText, exText){
  try { PLAN = JSON.parse(planText).plan; } catch(e) { PLAN = null; }
  try { DBG = JSON.parse(dbgText); } catch(e) { DBG = null; }
  if (!PLAN || !PLAN.length) return;
  document.getElementById('app').style.display = 'block';
  ritaStatus(); ritaDiagram(); ritaEkonomi(); ritaTimmar(); ritaPriser(); ritaModeller(); ritaLogg(exText);
}
function renderaFranFalt(){
  renderaAllt(document.getElementById('raw-plan').value,
              document.getElementById('raw-debug').value,
              document.getElementById('raw-exec').value);
}

// ---------- Anslutning ----------
const NAMN = { plan:'DP_Plan', debug:'DP_Debug', exec:'DP_Exec_Log' };
function status(t, k){ const e=document.getElementById('conn-sum'); e.textContent=t; e.className=k||''; }

async function hamta(bas, token, variant){
  const url = bas + '/api/manager/logic/variable' + (variant==='query' ? '?token='+encodeURIComponent(token) : '');
  const opt = variant==='query' ? {} : { headers:{ Authorization:'Bearer '+token } };
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

async function hamtaNu(){
  const bas = document.getElementById('c-url').value.trim().replace(/\/+$/,'');
  const token = document.getElementById('c-token').value.trim();
  if (!bas || !token) { status('fyll i adress och token','bad'); return; }
  let cfg = {}; try { cfg = JSON.parse(localStorage.getItem('dpems'))||{}; } catch(e){}
  const varianter = cfg.variant ? [cfg.variant, cfg.variant==='query'?'header':'query'] : ['query','header'];
  const fel = [];
  for (const v of varianter){
    try {
      const data = await hamta(bas, token, v);
      const val = {}; Object.values(data).forEach(x => val[x.name] = x.value);
      document.getElementById('raw-plan').value  = val[NAMN.plan]  || '';
      document.getElementById('raw-debug').value = val[NAMN.debug] || '';
      document.getElementById('raw-exec').value  = val[NAMN.exec]  || '';
      renderaFranFalt();
      try { localStorage.setItem('dpems', JSON.stringify({ bas, token, variant:v })); } catch(e){}
      const n = new Date();
      status(`uppdaterad ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`,'ok');
      document.getElementById('conn-log').innerHTML = '';
      return;
    } catch(e){ fel.push(`${v}: ${e.message}`); }
  }
  status('ingen kontakt','bad');
  document.getElementById('conn-log').innerHTML = fel.join('<br>');
  document.getElementById('d-conn').open = true;
}

function glomUppgifter(){
  try { localStorage.removeItem('dpems'); } catch(e){}
  document.getElementById('c-url').value=''; document.getElementById('c-token').value='';
  status('uppgifterna borttagna','');
}
function skapaBokmarke(){
  const bas=document.getElementById('c-url').value.trim().replace(/\/+$/,'');
  const token=document.getElementById('c-token').value.trim();
  if(!bas||!token){ status('fyll i adress och token','bad'); return; }
  document.getElementById('conn-log').innerHTML =
    'Spara som privat bokmärke. Länken innehåller din token:<br><span style="word-break:break-all">'
    + location.origin + location.pathname + '#bas=' + encodeURIComponent(bas) + '&token=' + encodeURIComponent(token)
    + '</span>';
}
function sparaFalt(){
  let cfg={}; try{ cfg=JSON.parse(localStorage.getItem('dpems'))||{}; }catch(e){}
  cfg.bas = document.getElementById('c-url').value.trim().replace(/\/+$/,'');
  cfg.token = document.getElementById('c-token').value.trim();
  try { localStorage.setItem('dpems', JSON.stringify(cfg)); } catch(e){}
}

window.addEventListener('load', () => {
  let cfg=null; try{ cfg=JSON.parse(localStorage.getItem('dpems')); }catch(e){}
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('bas') && h.get('token')){
    cfg = { bas:h.get('bas'), token:h.get('token'), variant: cfg && cfg.variant };
    try { localStorage.setItem('dpems', JSON.stringify(cfg)); } catch(e){}
    history.replaceState(null,'',location.pathname);
  }
  if (cfg){
    document.getElementById('c-url').value = cfg.bas || '';
    document.getElementById('c-token').value = cfg.token || '';
    hamtaNu();
  } else {
    document.getElementById('d-conn').open = true;
  }
  document.getElementById('c-url').addEventListener('change', sparaFalt);
  document.getElementById('c-token').addEventListener('change', sparaFalt);
  setInterval(hamtaNu, 60000);
});
</script>
